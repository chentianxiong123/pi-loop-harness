<div class="space-y-3">
    {{if .Lines}}
        {{range .Lines}}
        <div class="rounded-lg bg-base-200 p-3">
            <div class="flex items-center justify-between text-xs opacity-60">
                <span>{{.Author}}</span>
                <span>{{.At}}</span>
            </div>
            <p class="mt-1 text-sm">{{.Body}}</p>
        </div>
        {{end}}
    {{else}}
        <p class="text-sm opacity-50 text-center py-4">还没有留言，来发第一条。</p>
    {{end}}
</div>
