<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.9"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
    <div class="card w-full max-w-xl bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title">{{.Title}}</h2>
            <p class="text-sm opacity-70">全栈演示：表单 POST → HTMX 局部刷新（数据路径） + Alpine 折叠（纯视觉）。分工红线见 RULES.md §4.1。</p>

            <div id="msg-error" class="text-error text-sm"></div>

            <form class="flex flex-col gap-3"
                  hx-post="/msgwall/new"
                  hx-target="#msg-list"
                  hx-swap="innerHTML"
                  hx-indicator="#submit-spinner">
                <input name="author" placeholder="昵称" required
                       class="input input-bordered input-sm" />
                <input name="body" placeholder="留一句言…" required maxlength="500"
                       class="input input-bordered input-sm" />
                <button class="btn btn-primary btn-sm" type="submit">
                    <span id="submit-spinner" class="htmx-indicator loading loading-spinner loading-xs"></span>
                    发布
                </button>
            </form>

            <div class="divider"></div>

            <div x-data="{ open: false }">
                <button class="btn btn-ghost btn-xs w-full" @click="open = !open">
                    查看发布说明（Alpine 纯视觉，不碰数据）
                </button>
                <div x-show="open" x-transition class="mt-2 rounded-lg bg-base-200 p-3 text-xs">
                    数据（留言列表）由 Go 渲染或 HTMX 替换；Alpine 只控制开合。任何后端值都不进 x-data。
                </div>
            </div>

            <div id="msg-list">
                {{template "msg-list.html" .}}
            </div>
        </div>
    </div>
</body>
</html>
